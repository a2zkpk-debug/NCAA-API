<!-- ============================================================
     VIBECANO — CUSTOM SHOP PAGE
     Paste this whole file into an Elementor HTML widget on your Shop page.
     Do not paste it into the normal WordPress visual editor, otherwise
     the CSS can appear as plain text.

     Shows a modern custom shop for:
     - Ready-made products: category ready-made + tag ready-made
     - Customizable products: category customize + tag customizable
     ============================================================ -->


<section class="vc-shop">
  <div class="vc-shop-inner">
    <div class="vc-shop-hero">
      <div>
        <span class="vc-shop-kicker">Vibecano shop</span>
        <h1 class="vc-shop-title">Shop ready-made designs and <span>customizable products.</span></h1>
        <p class="vc-shop-sub">Browse Vibecano ready-made products, pick a design made by us, or choose a customizable product and make it your own.</p>
      </div>
      <div class="vc-shop-stats">
        <div class="vc-shop-stat"><b id="vcShopReadyCount">—</b><span>Ready-made</span></div>
        <div class="vc-shop-stat"><b id="vcShopCustomCount">—</b><span>Customizable</span></div>
      </div>
    </div>

    <div class="vc-shop-toolbar">
      <label class="vc-shop-search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="vcShopSearch" type="search" placeholder="Search products...">
      </label>
      <select class="vc-shop-sort" id="vcShopSort" aria-label="Sort products">
        <option value="popularity">Most Popular</option>
        <option value="date">Newest</option>
        <option value="price">Price Low to High</option>
        <option value="price-desc">Price High to Low</option>
      </select>
    </div>

    <div class="vc-shop-chips" id="vcShopChips"></div>
    <div class="vc-shop-grid" id="vcShopGrid" aria-live="polite"></div>
  </div>
</section>

<script>

der-color: rgba(249, 115, 22, 0.36);\n    color: var(--vc-shop-orange);\n    transform: translateY(-1px);\n  }\n\n  .vc-shop-chip.is-active {\n    border-color: #0f172a;\n    background: #0f172a;\n    color: #fff;\n  }\n\n  .vc-shop-grid {\n    display: grid;\n    grid-template-columns: repeat(4, minmax(0, 1fr));\n    gap: 18px;\n  }\n\n  .vc-shop-card {\n    display: flex;\n    overflow: hidden;\n    min-width: 0;\n    border: 1px solid rgba(226, 232, 240, 0.9);\n    border-radius: 26px;\n    background: #fff;\n    box-shadow: 0 20px 55px -44px rgba(15, 23, 42, 0.75);\n    flex-direction: column;\n    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;\n  }\n\n  .vc-shop-card:hover {\n    border-color: rgba(249, 115, 22, 0.28);\n    box-shadow: 0 30px 72px -48px rgba(15, 23, 42, 0.95);\n    transform: translateY(-6px);\n  }\n\n  .vc-shop-img {\n    position: relative;\n    overflow: hidden;\n    aspect-ratio: 1 / 1;\n    background:\n      linear-gradient(135deg, rgba(249, 115, 22, 0.08), rgba(37, 99, 235, 0.08)),\n      var(--vc-shop-soft);\n  }\n\n  .vc-shop-img img {\n    width: 100%;\n    height: 100%;\n    display: block;\n    object-fit: cover;\n    transition: transform 0.45s ease, filter 0.45s ease;\n  }\n\n  .vc-shop-card:hover .vc-shop-img img {\n    filter: saturate(1.08);\n    transform: scale(1.065);\n  }\n\n  .vc-shop-pill {\n    position: absolute;\n    top: 12px;\n    left: 12px;\n    padding: 7px 10px;\n    border-radius: 999px;\n    background: rgba(15, 23, 42, 0.8);\n    color: #fff;\n    font-size: 10px;\n    font-weight: 900;\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n    backdrop-filter: blur(10px);\n  }\n\n  .vc-shop-body {\n    display: flex;\n    flex: 1;\n    flex-direction: column;\n    padding: 15px;\n  }\n\n  .vc-shop-name {\n    display: -webkit-box;\n    overflow: hidden;\n    min-height: 43px;\n    margin: 0 0 8px;\n    color: var(--vc-shop-text);\n    font-family: Manrope, Inter, sans-serif;\n    font-size: 16px;\n    font-weight: 800;\n    line-height: 1.32;\n    text-decoration: none;\n    -webkit-box-orient: vertical;\n    -webkit-line-clamp: 2;\n  }\n\n  .vc-shop-desc {\n    display: -webkit-box;\n    overflow: hidden;\n    min-height: 42px;\n    margin: 0 0 13px;\n    color: var(--vc-shop-muted);\n    font-size: 13px;\n    font-weight: 600;\n    line-height: 1.55;\n    -webkit-box-orient: vertical;\n    -webkit-line-clamp: 2;\n  }\n\n  .vc-shop-price {\n    margin-bottom: 13px;\n    color: var(--vc-shop-text);\n    font-family: Manrope, Inter, sans-serif;\n    font-size: 18px;\n    font-weight: 800;\n    line-height: 1.2;\n  }\n\n  .vc-shop-price del {\n    margin-right: 7px;\n    color: #94a3b8;\n    font-size: 13px;\n  }\n\n  .vc-shop-price ins {\n    text-decoration: none;\n  }\n\n  .vc-shop-actions {\n    display: grid;\n    grid-template-columns: 1fr;\n    gap: 8px;\n    margin-top: auto;\n  }\n\n  .vc-shop-btn {\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    min-height: 40px;\n    border-radius: 14px;\n    color: #fff;\n    font-size: 12px;\n    font-weight: 900;\n    text-align: center;\n    text-decoration: none;\n    transition: transform 0.18s ease, filter 0.18s ease;\n  }\n\n  .vc-shop-btn.primary {\n    background: #0f172a;\n  }\n\n  .vc-shop-btn.custom {\n    background: linear-gradient(135deg, var(--vc-shop-orange), #ec4899);\n  }\n\n  .vc-shop-btn:hover,\n  .vc-shop-btn:focus-visible {\n    filter: saturate(1.08);\n    transform: translateY(-1px);\n  }\n\n  .vc-shop-message {\n    grid-column: 1 / -1;\n    padding: 40px 18px;\n    border: 1px dashed rgba(148, 163, 184, 0.55);\n    border-radius: 24px;\n    background: #fff;\n    color: var(--vc-shop-muted);\n    font-size: 14px;\n    font-weight: 800;\n    text-align: center;\n  }\n\n  .vc-shop-skeleton {\n    min-height: 360px;\n    border-radius: 26px;\n    background:\n      linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.82), transparent),\n      rgba(226, 232, 240, 0.7);\n    background-size: 220% 100%;\n    animation: vcShopShimmer 1.3s linear infinite;\n  }\n\n  @keyframes vcShopShimmer {\n    to { background-position: -220% 0; }\n  }\n\n  @media (max-width: 1100px) {\n    .vc-shop-grid {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n  }\n\n  @media (max-width: 820px) {\n    .vc-shop {\n      padding: 34px 14px 64px;\n    }\n\n    .vc-shop-hero,\n    .vc-shop-toolbar {\n      grid-template-columns: 1fr;\n    }\n\n    .vc-shop-stats {\n      min-width: 0;\n    }\n\n    .vc-shop-sort {\n      width: 100%;\n    }\n\n    .vc-shop-grid {\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 14px;\n    }\n  }\n\n  @media (max-width: 520px) {\n    .vc-shop-grid {\n      grid-template-columns: 1fr;\n    }\n  }\n';
  var style = document.createElement("style");

(function () {
  "use strict";

  var CONFIG = {
    perPage: 12,
    endpoints: {
      products: "/wp-json/wc/store/v1/products",
      categories: "/wp-json/wc/store/v1/products/categories",
      tags: "/wp-json/wc/store/v1/products/tags"
    },
    groups: {
      ready: { parentSlug: "ready-made", tagSlug: "ready-made", label: "Ready-Made" },
      custom: { parentSlug: "customize", tagSlug: "customizable", label: "Customizable" }
    }
  };

  var state = {
    active: "all",
    sort: "popularity",
    search: ""
  };

  var taxonomy = {
    categories: [],
    tags: [],
    readyParent: null,
    customParent: null,
    readyTag: null,
    customTag: null
  };

  var productsCache = Object.create(null);
  var chipsEl = document.getElementById("vcShopChips");
  var gridEl = document.getElementById("vcShopGrid");
  var sortEl = document.getElementById("vcShopSort");
  var searchEl = document.getElementById("vcShopSearch");

  if (!chipsEl || !gridEl || !sortEl || !searchEl || !window.fetch) {
    return;
  }

  init();

  function init() {
    sortEl.addEventListener("change", function () {
      state.sort = sortEl.value;
      loadProducts();
    });

    searchEl.addEventListener("input", debounce(function () {
      state.search = searchEl.value.trim();
      loadProducts();
    }, 260));

    Promise.all([
      fetchJson(CONFIG.endpoints.categories + "?per_page=100"),
      fetchJson(CONFIG.endpoints.tags + "?per_page=100")
    ])
      .then(function (results) {
        taxonomy.categories = Array.isArray(results[0]) ? results[0] : [];
        taxonomy.tags = Array.isArray(results[1]) ? results[1] : [];
        taxonomy.readyParent = findBySlug(taxonomy.categories, CONFIG.groups.ready.parentSlug);
        taxonomy.customParent = findBySlug(taxonomy.categories, CONFIG.groups.custom.parentSlug);
        taxonomy.readyTag = findBySlug(taxonomy.tags, CONFIG.groups.ready.tagSlug);
        taxonomy.customTag = findBySlug(taxonomy.tags, CONFIG.groups.custom.tagSlug);
        renderChips();
        loadProducts();
      })
      .catch(function () {
        renderMessage("Could not load shop filters. Please refresh the page.");
      });
  }

  function renderChips() {
    var chips = [
      { key: "all", label: "All Products" },
      { key: "ready", label: "All Ready-Made" },
      { key: "custom", label: "All Customizable" }
    ];

    getChildren(taxonomy.readyParent).forEach(function (category) {
      chips.push({ key: "ready:" + category.id, label: category.name });
    });

    getChildren(taxonomy.customParent).forEach(function (category) {
      chips.push({ key: "custom:" + category.id, label: category.name });
    });

    chipsEl.innerHTML = chips.map(function (chip) {
      return '<button type="button" class="vc-shop-chip ' + (chip.key === state.active ? "is-active" : "") + '" data-key="' + escapeAttr(chip.key) + '">' + escapeHtml(chip.label) + '</button>';
    }).join("");

    Array.prototype.forEach.call(chipsEl.querySelectorAll(".vc-shop-chip"), function (button) {
      button.addEventListener("click", function () {
        state.active = button.dataset.key;
        Array.prototype.forEach.call(chipsEl.querySelectorAll(".vc-shop-chip"), function (item) {
          item.classList.toggle("is-active", item.dataset.key === state.active);
        });
        loadProducts();
      });
    });
  }

  function loadProducts() {
    renderLoading();

    var requests = buildRequests();
    if (!requests.length) {
      renderMessage("No product filters found.");
      return;
    }

    Promise.all(requests.map(fetchProducts))
      .then(function (lists) {
        var products = uniqueProducts([].concat.apply([], lists));
        products = products.filter(productMatchesSearch);
        products = sortProducts(products).slice(0, CONFIG.perPage);
        updateCounts();
        renderProducts(products);
      })
      .catch(function () {
        renderMessage("Products could not be loaded. Please refresh the page.");
      });
  }

  function buildRequests() {
    var active = state.active;
    if (active === "all") {
      return [requestForGroup("ready"), requestForGroup("custom")].filter(Boolean);
    }
    if (active === "ready") return [requestForGroup("ready")].filter(Boolean);
    if (active === "custom") return [requestForGroup("custom")].filter(Boolean);
    if (active.indexOf("ready:") === 0) return [requestForGroup("ready", active.split(":")[1])].filter(Boolean);
    if (active.indexOf("custom:") === 0) return [requestForGroup("custom", active.split(":")[1])].filter(Boolean);
    return [];
  }

  function requestForGroup(groupName, categoryId) {
    var parent = groupName === "ready" ? taxonomy.readyParent : taxonomy.customParent;
    var tag = groupName === "ready" ? taxonomy.readyTag : taxonomy.customTag;
    if (!parent || !tag) return null;
    return {
      group: groupName,
      categoryId: categoryId || parent.id,
      tagId: tag.id
    };
  }

  function fetchProducts(request) {
    var key = [request.group, request.categoryId, request.tagId, state.sort].join("|");
    if (productsCache[key]) {
      return Promise.resolve(productsCache[key]);
    }

    var params = new URLSearchParams();
    params.set("per_page", String(CONFIG.perPage));
    params.set("category", String(request.categoryId));
    params.set("tag", String(request.tagId));

    if (state.sort === "price" || state.sort === "price-desc") {
      params.set("orderby", "price");
      params.set("order", state.sort === "price-desc" ? "desc" : "asc");
    } else if (state.sort === "date") {
      params.set("orderby", "date");
      params.set("order", "desc");
    } else {
      params.set("orderby", "popularity");
      params.set("order", "desc");
    }

    return fetchJson(CONFIG.endpoints.products + "?" + params.toString()).then(function (products) {
      var safeProducts = Array.isArray(products) ? products.map(function (product) {
        product.__vcGroup = request.group;
        return product;
      }) : [];
      productsCache[key] = safeProducts;
      return safeProducts;
    });
  }

  function updateCounts() {
    var readyRequest = requestForGroup("ready");
    var customRequest = requestForGroup("custom");
    Promise.all([
      readyRequest ? fetchProducts(readyRequest) : Promise.resolve([]),
      customRequest ? fetchProducts(customRequest) : Promise.resolve([])
    ]).then(function (results) {
      document.getElementById("vcShopReadyCount").textContent = results[0].length;
      document.getElementById("vcShopCustomCount").textContent = results[1].length;
    });
  }

  function renderLoading() {
    gridEl.innerHTML = "";
    for (var i = 0; i < 8; i += 1) {
      var item = document.createElement("div");
      item.className = "vc-shop-skeleton";
      gridEl.appendChild(item);
    }
  }

  function renderProducts(products) {
    if (!products.length) {
      renderMessage("No products found for this filter.");
      return;
    }
    gridEl.innerHTML = products.map(renderProductCard).join("");
  }

  function renderProductCard(product) {
    var image = product.images && product.images[0] ? product.images[0] : null;
    var isCustom = product.__vcGroup === "custom" || productHasTerm(product, "tags", CONFIG.groups.custom.tagSlug);
    var actionUrl = isCustom ? buildCustomizeUrl(product) : "/?add-to-cart=" + encodeURIComponent(product.id || "");
    var actionText = isCustom ? "Customize Now" : "Add to Cart";

    return [
      '<article class="vc-shop-card">',
        '<a class="vc-shop-img" href="' + escapeAttr(product.permalink || "#") + '">',
          '<span class="vc-shop-pill">' + escapeHtml(isCustom ? "Customizable" : "Ready-made") + '</span>',
          image ? '<img src="' + escapeAttr(image.src) + '" alt="' + escapeAttr(image.alt || product.name || "Product") + '" loading="lazy" decoding="async">' : "",
        '</a>',
        '<div class="vc-shop-body">',
          '<a class="vc-shop-name" href="' + escapeAttr(product.permalink || "#") + '">' + escapeHtml(product.name || "Product") + '</a>',
          '<p class="vc-shop-desc">' + escapeHtml(getDescription(product)) + '</p>',
          '<div class="vc-shop-price">' + formatPrice(product) + '</div>',
          '<div class="vc-shop-actions">',
            '<a class="vc-shop-btn ' + (isCustom ? "custom" : "primary") + '" href="' + escapeAttr(actionUrl) + '">' + escapeHtml(actionText) + '</a>',
          '</div>',
        '</div>',
      '</article>'
    ].join("");
  }

  function fetchJson(url) {
    return fetch(url, { credentials: "same-origin" }).then(function (response) {
      if (!response.ok) throw new Error("Request failed");
      return response.json();
    });
  }

  function getChildren(parent) {
    if (!parent) return [];
    return taxonomy.categories.filter(function (category) {
      return category && Number(category.parent) === Number(parent.id);
    });
  }

  function findBySlug(items, slug) {
    return (items || []).filter(function (item) {
      return item && item.slug === slug;
    })[0] || null;
  }

  function uniqueProducts(products) {
    var seen = Object.create(null);
    return products.filter(function (product) {
      if (!product || seen[product.id]) return false;
      seen[product.id] = true;
      return true;
    });
  }

  function productMatchesSearch(product) {
    if (!state.search) return true;
    var needle = state.search.toLowerCase();
    return String(product.name || "").toLowerCase().indexOf(needle) >= 0 ||
      stripHtml(product.short_description || product.description || "").toLowerCase().indexOf(needle) >= 0;
  }

  function sortProducts(products) {
    if (state.sort === "price" || state.sort === "price-desc") {
      return products.sort(function (a, b) {
        var aPrice = Number(a.prices && a.prices.price ? a.prices.price : 0);
        var bPrice = Number(b.prices && b.prices.price ? b.prices.price : 0);
        return state.sort === "price-desc" ? bPrice - aPrice : aPrice - bPrice;
      });
    }
    return products;
  }

  function productHasTerm(product, key, slug) {
    return (product[key] || []).some(function (term) {
      return term && term.slug === slug;
    });
  }

  function buildCustomizeUrl(product) {
    var base = product.permalink || "#";
    var separator = base.indexOf("?") === -1 ? "?" : "&";
    return base + separator + "customize=1&product_cms=" + encodeURIComponent(product.id || "");
  }

  function getDescription(product) {
    var text = stripHtml(product.short_description || product.description || "");
    if (text.length <= 105) return text;
    return text.slice(0, 105).replace(/\s+\S*$/, "") + "...";
  }

  function formatPrice(product) {
    if (product.price_html && /\d/.test(product.price_html)) return product.price_html;
    if (!product.prices || !product.prices.price) return "";
    return escapeHtml(formatMoney(product.prices, product.prices.price));
  }

  function formatMoney(prices, value) {
    var decimals = Number.isFinite(Number(prices.currency_minor_unit)) ? Number(prices.currency_minor_unit) : 2;
    var amount = Number.parseInt(value, 10);
    var symbol = prices.currency_prefix || prices.currency_symbol || "";
    var suffix = prices.currency_suffix || "";
    if (!Number.isFinite(amount)) return "";
    return symbol + (amount / Math.pow(10, decimals)).toLocaleString(undefined, { maximumFractionDigits: decimals }) + suffix;
  }

  function stripHtml(value) {
    var node = document.createElement("div");
    node.innerHTML = String(value || "");
    return (node.textContent || node.innerText || "").replace(/\s+/g, " ").trim();
  }

  function renderMessage(message) {
    gridEl.innerHTML = '<div class="vc-shop-message">' + escapeHtml(message) + '</div>';
  }

  function debounce(fn, delay) {
    var timer = null;
    return function () {
      clearTimeout(timer);
      timer = setTimeout(fn, delay);
    };
  }

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, function (character) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[character];
    });
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, "&#96;");
  }
})();
</script>
